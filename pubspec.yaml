name: clean_droid
description: CleanDroid - Phone Cleaner & Performance Optimizer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  device_info_plus: ^10.1.0
  path_provider: ^2.1.3
  battery_plus: ^6.0.1
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/images/
