name: Android Release → Play Store

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]

jobs:
  build-and-deploy:
    name: Build & Deploy AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ─────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── 4. Dependencies ────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 5. Decode keystore ─────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" \
            | base64 --decode > $GITHUB_WORKSPACE/keystore.jks

      # ── 6. Build signed AAB (signing passed directly to Gradle) ────────
      - name: Build release AAB
        env:
          STORE_FILE: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ── 7. Verify it is NOT debug-signed ───────────────────────────────
      - name: Verify release signing
        run: |
          SIGNER=$(unzip -p build/app/outputs/bundle/release/app-release.aab \
            META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep "Owner" || true)
          echo "Signer info: $SIGNER"
          if echo "$SIGNER" | grep -qi "Android Debug"; then
            echo "ERROR: still debug-signed!" && exit 1
          fi

      # ── 8. Upload AAB as GitHub artifact ───────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: purgify-${{ github.run_number }}.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 9. Deploy to Play Store ────────────────────────────────────────
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.metavisionrs.clean_droid
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: distribution/whatsnew
