name: Android Release → Play Store

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]

jobs:
  build-and-deploy:
    name: Build & Deploy AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (required by Gradle) ───────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ─────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      # ── 4. Decode keystore from secret ─────────────────────────────────
      - name: Decode release keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode \
            > android/app/purgify-release.keystore

      # ── 5. Write key.properties ────────────────────────────────────────
      - name: Create key.properties
        run: |
          cat > android/app/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=purgify-release.keystore
          EOF

      # ── 6. Flutter pub get ─────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 7. Bump version from tag (optional, skipped if no tag) ─────────
      - name: Bump version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"   # e.g. 1.2.3
          BUILD="${GITHUB_RUN_NUMBER}"
          sed -i "s/^version:.*/version: ${TAG}+${BUILD}/" pubspec.yaml
          echo "Version set to ${TAG}+${BUILD}"

      # ── 8. Build signed AAB ────────────────────────────────────────────
      - name: Build release AAB
        run: flutter build appbundle --release

      # ── 9. Upload AAB as GitHub artifact ──────────────────────────────
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: purgify-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 10. Deploy to Play Store ───────────────────────────────────────
      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.metavisionrs.clean_droid
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
          inAppUpdatePriority: 2
          whatsNewDirectory: distribution/whatsnew
